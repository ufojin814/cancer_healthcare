<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OncoPilot 临床试验匹配（个人自用）</title>
  <style>
    :root { --ink:#1f2933; --sub:#52606d; --line:#d9e2ec; --bg:#f5f7fa; --card:#fff; --accent:#0f766e; --warn:#b45309; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,"Microsoft YaHei",sans-serif; color:var(--ink); background:var(--bg); }
    header { padding:20px 28px; background:var(--card); border-bottom:1px solid var(--line); }
    header h1 { margin:0 0 6px; font-size:19px; }
    .disclaimer { font-size:12px; color:var(--warn); background:#fffbeb; border:1px solid #fde68a; border-radius:8px; padding:8px 12px; }
    main { max-width:1180px; margin:0 auto; padding:20px 28px 60px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:18px; }
    .card h2 { font-size:15px; margin:0 0 12px; }
    .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    input[type=text], textarea { width:100%; border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-size:13px; font-family:inherit; }
    textarea { min-height:120px; resize:vertical; }
    button { border:0; border-radius:8px; padding:9px 16px; font-size:13px; cursor:pointer; background:var(--accent); color:#fff; }
    button.secondary { background:#e4e7eb; color:var(--ink); }
    .meta { font-size:12px; color:var(--sub); }
    .tag { display:inline-block; border-radius:6px; padding:2px 8px; font-size:12px; }
    .green { background:#ecfdf5; color:#047857; }
    .yellow { background:#fffbeb; color:#b45309; }
    .red { background:#fef2f2; color:#b91c1c; }
    .verdict-match { color:#047857; font-weight:600; }
    .verdict-maybe { color:#b45309; font-weight:600; }
    .verdict-no { color:#b91c1c; }
    table { border-collapse:collapse; width:100%; font-size:12px; }
    th, td { border-bottom:1px solid var(--line); padding:8px; vertical-align:top; text-align:left; }
    th { color:var(--sub); font-weight:600; background:#f8fafc; }
    .links a { color:var(--accent); }
    .muted { color:var(--sub); }
    .summary { display:flex; gap:18px; flex-wrap:wrap; font-size:13px; }
    .summary b { color:var(--sub); }
  </style>
</head>
<body>
<header>
  <h1>OncoPilot · 本地临床试验匹配（个人自用）</h1>
  <div class="disclaimer">{{ disclaimer }}</div>
</header>
<main>
  <section class="card">
    <h2>1. 数据同步（每次查询前刷新为最新公开登记信息）</h2>
    <div class="row">
      <input type="text" id="term" placeholder="可选：限定癌种/关键词，如 non-small cell lung cancer；留空则按增量同步" style="max-width:380px">
      <button onclick="refreshData()">同步最新数据</button>
      <span class="meta" id="syncStatus">尚未同步</span>
    </div>
  </section>

  <section class="card">
    <h2>2. 录入病历</h2>
    <div class="row" style="margin-bottom:10px">
      <input type="file" id="file" accept=".pdf,.txt">
      <span class="meta">支持 PDF / TXT；扫描件图片需先转为可复制文本。上传前请删除姓名、身份证号、电话等身份信息。</span>
    </div>
    <textarea id="text" placeholder="或直接粘贴病历文本：诊断、病理、分期、基因检测结果、既往治疗线数与用药、近期化验、ECOG 评分、所在城市……"></textarea>
    <div class="row" style="margin-top:10px">
      <button onclick="runMatch()">开始匹配</button>
      <button class="secondary" onclick="exportReport('html')">导出 HTML 报告</button>
      <button class="secondary" onclick="exportReport('csv')">导出 CSV</button>
      <span class="meta" id="matchStatus"></span>
    </div>
  </section>

  <section class="card" id="summaryCard" style="display:none">
    <h2>患者画像（规则抽取，请人工核对）</h2>
    <div class="summary" id="summary"></div>
  </section>

  <section class="card">
    <h2>3. 候选试验</h2>
    <table>
      <thead><tr>
        <th>判定</th><th>时效</th><th>状态</th><th>标题 / 链接</th><th>期别</th>
        <th>癌种命中</th><th>靶点命中</th><th>干预/方案</th><th>研究中心</th><th>理由 / 存疑</th>
      </tr></thead>
      <tbody id="results"></tbody>
    </table>
  </section>

  <section class="card links">
    <h2>4. 其他登记库人工核对入口（无开放 API，需手动检索）</h2>
    <div id="registryLinks" class="meta"></div>
  </section>
</main>

<script>
function tierClass(t){ return t==='green'?'green':t==='yellow'?'yellow':'red'; }
function verdictClass(v){ return v==='可能匹配'?'verdict-match':v==='存疑待核'?'verdict-maybe':'verdict-no'; }

async function refreshData(){
  const term = document.getElementById('term').value.trim();
  const fd = new FormData(); if(term) fd.append('term', term);
  document.getElementById('syncStatus').textContent = '同步中……';
  const resp = await fetch('/api/refresh', { method:'POST', body:fd });
  const data = await resp.json();
  if(data.error){ document.getElementById('syncStatus').textContent = data.error; return; }
  document.getElementById('syncStatus').textContent =
    `本地库 ${data.local_total} 条；本次拉取 ${data.fetched} 条；数据批次 ${data.data_timestamp || '未知'}`;
}

async function runMatch(){
  const fd = new FormData();
  const file = document.getElementById('file').files[0];
  const text = document.getElementById('text').value;
  if(file) fd.append('file', file);
  if(text.trim()) fd.append('text', text);
  document.getElementById('matchStatus').textContent = '解析与匹配中……';
  const resp = await fetch('/api/match', { method:'POST', body:fd });
  const data = await resp.json();
  if(data.error){ document.getElementById('matchStatus').textContent = data.error; return; }
  document.getElementById('matchStatus').textContent = `共 ${data.results.length} 条候选；数据批次 ${data.meta.data_timestamp || '本地快照'}`;

  const p = data.profile;
  document.getElementById('summaryCard').style.display = 'block';
  document.getElementById('summary').innerHTML =
    `<span><b>年龄：</b>${p.age||'未识别'}</span><span><b>性别：</b>${p.sex||'未识别'}</span>` +
    `<span><b>癌种：</b>${(p.conditions||[]).join('、')||'未识别'}</span>` +
    `<span><b>靶点：</b>${(p.biomarkers||[]).join('、')||'未识别'}</span>` +
    `<span><b>分期：</b>${p.stage||'未识别'}</span>` +
    `<span><b>既往用药：</b>${(p.prior_drugs||[]).join('、')||'无'}</span>`;

  const tbody = document.getElementById('results');
  tbody.innerHTML = '';
  data.results.forEach(r => {
    const tr = document.createElement('tr');
    const reason = (r.reasons||[]).concat(r.flags||[]).join('；');
    tr.innerHTML =
      `<td class="${verdictClass(r.verdict)}">${r.verdict}</td>` +
      `<td><span class="tag ${tierClass(r.tier)}">${r.tier_label}</span></td>` +
      `<td>${r.status_label}</td>` +
      `<td>${r.url?`<a href="${r.url}" target="_blank" rel="noopener">${escapeHtml(r.title)}</a>`:escapeHtml(r.title)}<br><span class="muted">${r.registry_id}</span></td>` +
      `<td>${r.phase||''}</td><td>${(r.condition_hit||[]).join('、')}</td>` +
      `<td>${(r.biomarker_hit||[]).join('、')}</td><td>${escapeHtml(r.intervention||'')}</td>` +
      `<td>${escapeHtml(r.location_text||'')}</td><td>${escapeHtml(reason)}</td>`;
    tbody.appendChild(tr);
  });

  const links = document.getElementById('registryLinks');
  links.innerHTML = (data.registry_links||[]).map(l =>
    `<div>· <a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>　<span class="muted">${l.query_hint}；${l.note}</span></div>`
  ).join('');
}

async function exportReport(fmt){
  const resp = await fetch('/api/export?fmt='+fmt);
  const data = await resp.json();
  if(data.error){ alert(data.error); return; }
  alert('报告已生成：' + data.file);
}

function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
